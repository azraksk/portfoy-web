<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Sertifika Detayı</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="cert-detail">

  <div class="cert-box">
    <img id="certImage" class="cert-img" src="" alt="Sertifika Görseli">

    <div class="cert-content">
      <h2 id="certTitle"></h2>

      <ul class="cert-meta">
        <li><strong>📅 Tarih:</strong> <span id="certDate"></span></li>
        <li><strong>🏢 Kurum:</strong> <span id="certOrg"></span></li>
      </ul>

      <p id="certDesc"></p>

      <h3>🧠 Kazanımlar</h3>
      <ul id="certSkills" class="cert-skills"></ul>

      <div id="certTags" class="cert-tags"></div>

      <a href="sertifikalar.html" class="back-btn">← Sertifikalara Dön</a>
    </div>
  </div>

</main>

<script src="script.js"></script>
